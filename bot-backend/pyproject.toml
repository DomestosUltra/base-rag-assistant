[project]
name = "bot-backend"
version = "0.1.0"
description = "RAG backend service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "dishka>=1.6.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain>=1.1.0",
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-weaviate>=0.0.5",
    "openai>=1.65.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.37",
    "sqlmodel>=0.0.22",
    "structlog>=25.1.0",
    "uvicorn>=0.34.0",
    "uuid-utils>=0.9.0",
    "weaviate-client>=4.10.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true

[[tool.mypy.overrides]]
module = "uuid_utils.*"
ignore_missing_imports = true
