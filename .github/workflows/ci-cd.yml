name: CI/CD

on:
  push:
    branches:
      - stage
  workflow_dispatch:

concurrency:
  group: ci-cd-stage
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend checks
        working-directory: bot-backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy backend

      - name: Telegram bot checks
        working-directory: bot-telegram
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy bot

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/stage'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      backend_image: ${{ steps.vars.outputs.backend_image }}
      bot_image: ${{ steps.vars.outputs.bot_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${OWNER_LOWER}/base-rag-assistant-backend" >> "$GITHUB_OUTPUT"
          echo "bot_image=ghcr.io/${OWNER_LOWER}/base-rag-assistant-bot" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./bot-backend
          push: true
          tags: |
            ${{ steps.vars.outputs.backend_image }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.backend_image }}:stage

      - name: Build and push bot image
        uses: docker/build-push-action@v6
        with:
          context: ./bot-telegram
          push: true
          tags: |
            ${{ steps.vars.outputs.bot_image }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.bot_image }}:stage

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/stage'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ghcr.io
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          BOT_IMAGE: ${{ needs.build-and-push.outputs.bot_image }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: REGISTRY,REGISTRY_USERNAME,REGISTRY_PASSWORD,BACKEND_IMAGE,BOT_IMAGE,IMAGE_TAG
          script: |
            set -eu
            APP_DIR="${{ secrets.APP_DIR }}"
            BRANCH="${{ secrets.DEPLOY_BRANCH || 'stage' }}"
            if [ -z "$APP_DIR" ]; then
              echo "APP_DIR secret is required"
              exit 1
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            if [ -z "${REGISTRY_USERNAME:-}" ] || [ -z "${REGISTRY_PASSWORD:-}" ]; then
              echo "REGISTRY_USERNAME and REGISTRY_PASSWORD secrets are required"
              exit 1
            fi

            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

            cat > .deploy.env <<EOF
            BACKEND_IMAGE=$BACKEND_IMAGE
            BOT_IMAGE=$BOT_IMAGE
            IMAGE_TAG=$IMAGE_TAG
            EOF

            docker compose --env-file .deploy.env -f docker-compose.registry.yml pull backend bot
            docker compose --env-file .deploy.env -f docker-compose.registry.yml up -d --remove-orphans
            docker image prune -f