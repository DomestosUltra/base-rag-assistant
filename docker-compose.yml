services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  weaviate:
    image: semitechnologies/weaviate:1.27.10
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  weaviate-ui:
    image: naaive/weaviate-ui:latest
    platform: linux/amd64
    container_name: rag4u-weaviate-ui
    restart: unless-stopped
    depends_on:
      weaviate:
        condition: service_healthy
    ports:
      - "${WEAVIATE_UI_EXTERNAL_PORT}:7777"
    environment:
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_API_KEYS: ${WEAVIATE_API_KEY:-}
      TLS_VERIFY: "false"
      TLS_HOSTNAME_VERIFY: "false"
      PORT: "3000"

  backend:
    build:
      context: ./bot-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy

  bot:
    build:
      context: ./bot-telegram
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  weaviate_data:
