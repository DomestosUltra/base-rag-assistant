[project]
name = "bot-telegram"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-docx>=1.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "structlog>=25.1.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
